[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "context-contrast-exp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6"]
[project.optional-dependencies]
dev = ["pytest>=8"]
openai = ["openai>=1"]
[project.scripts]
cc-exp = "context_contrast_exp.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/context_contrast_exp"]
[tool.pytest.ini_options]
pythonpath = ["src"]
